name: Local checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_core.py tests/test_grading.py tests/test_grading_integration.py
